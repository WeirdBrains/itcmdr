[package]
name = "itcmdr-adminsvr"
version = "0.20.0"
edition.workspace = true
license.workspace = true
description = "itcmdr offsite admin server: users and roles, signed admin API, hash-chained audit, SiteLink"

[[bin]]
name = "itcmdr-adminsvr"
path = "src/main.rs"

[dependencies]
anyhow = "1.0"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
hex = "0.4"
sha2 = "0.10"
rand = "0.8"
base64 = "0.22"
ed25519-dalek = { version = "2.1", features = ["rand_core"] }
tokio = { version = "1.40", features = ["rt-multi-thread", "macros", "signal", "time", "sync", "net", "fs", "process"] }
tokio-stream = { version = "0.1", features = ["net"] }
tonic = { version = "0.12", features = ["transport", "tls"] }
prost = "0.13"
diesel = { version = "2.3", default-features = false, features = ["postgres", "sqlite", "r2d2"] }
diesel_migrations = { version = "2.3", features = ["postgres", "sqlite"] }
# No system libpq or libsqlite3 needed: both are built in.
pq-sys = { version = "0.7", features = ["bundled"] }
libsqlite3-sys = { version = "0.30", features = ["bundled"] }
uuid = { version = "1.10", features = ["v4"] }
clap = { version = "4.5", features = ["derive", "env"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["fmt", "env-filter"] }
parking_lot = "0.12"
# v0.19.2 push (FCM / APNs over HTTPS; HTTP/2 for APNs)
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls-webpki-roots", "http2", "json"] }
jsonwebtoken = "9"
# v0.20.0 plugin catalog: read package.toml from an uploaded package
tar = { version = "0.4", default-features = false }
flate2 = "1"
toml = "0.8"
itcmdr-keys = { path = "../keys" }
itcmdr-adminlink = { path = "../adminlink" }
itcmdr-agentlink = { path = "../agentlink" }

[target.'cfg(windows)'.dependencies]
windows-service = "0.7"

[dev-dependencies]
sqlx = { version = "0.8", default-features = false, features = ["runtime-tokio", "sqlite"] }
tempfile = "3.10"
itcmdr-admin-cli = { path = "../admin-cli", features = ["soft-authenticator"] }
itcmdr-server = { path = "../server" }
chrono = "0.4"
rsa = { version = "0.9", features = ["pem"] }
p256 = { version = "0.13", features = ["pkcs8", "pem"] }

[lints]
workspace = true
