[package]
name = "itcmdr-admin-cli"
version = "1.3.2"
edition.workspace = true
license.workspace = true
description = "itcmdr-admin: the adminsvr CLI (same signed API as the admin app)"

[lib]
name = "itcmdr_admin"
path = "src/lib.rs"

[[bin]]
name = "itcmdr-admin"
path = "src/main.rs"

[dependencies]
itcmdr-help = { path = "../help" }
anyhow = "1.0"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
hex = "0.4"
ed25519-dalek = "2.1"
tokio = { version = "1.40", features = ["rt-multi-thread", "macros"] }
tonic = { version = "0.12", features = ["transport", "tls"] }
prost = "0.13"
clap = { version = "4.5", features = ["derive", "env"] }
uuid = { version = "1.10", features = ["v4"] }
directories = "5"
zeroize = "1.8"
itcmdr-keys = { path = "../keys" }
base64 = "0.22"
sha2 = "0.10"
hkdf = "0.12"
chacha20poly1305 = "0.10"
rand = "0.8"
tempfile = "3.10"
p256 = { version = "0.13", features = ["ecdsa"], optional = true }
hmac = { version = "0.12", optional = true }
ciborium = { version = "0.2", optional = true }
itcmdr-adminlink = { path = "../adminlink" }
itcmdr-agentlink = { path = "../agentlink" }

[features]
# A software authenticator for tests (never in release builds).
soft-authenticator = ["dep:p256", "dep:hmac", "dep:ciborium"]

[lints]
workspace = true
