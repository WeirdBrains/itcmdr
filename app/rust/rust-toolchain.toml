[toolchain]
# native_toolchain_rust (flutter_rust_bridge native assets, v0.20.0: replaces cargokit so iOS/macOS
# build with Swift Package Manager, no CocoaPods) needs an exact toolchain; keep it in step with the
# workspace (parking_lot 0.13 needs >= 1.95).
channel = "1.99.1"
targets = [
  "aarch64-apple-darwin",
  "aarch64-apple-ios",
  "aarch64-apple-ios-sim",
  "aarch64-linux-android",
  "armv7-linux-androideabi",
  "x86_64-apple-darwin",
  "x86_64-apple-ios",
  "x86_64-linux-android",
  "x86_64-pc-windows-msvc",
  "x86_64-unknown-linux-gnu",
]
