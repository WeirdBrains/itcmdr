[package]
name = "itcmdr_keys_bridge"
version = "0.15.2"
edition = "2021"
license = "Apache-2.0"
description = "flutter_rust_bridge glue: the Flutter app's crypto comes from itcmdr-keys"

[lib]
crate-type = ["cdylib", "staticlib", "rlib"]

[dependencies]
flutter_rust_bridge = "=2.13.0"
itcmdr-keys = { path = "../../keys" }
anyhow = "1.0"
hex = "0.4"

[lints.rust]
unexpected_cfgs = { level = "warn", check-cfg = ['cfg(frb_expand)'] }

# Separate workspace: cargokit builds it for each Flutter platform.
[workspace]
