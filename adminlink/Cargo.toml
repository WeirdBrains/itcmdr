[package]
name = "itcmdr-adminlink"
version = "0.21.0"
edition.workspace = true
license.workspace = true
description = "itcmdr adminsvr link: admin.proto, site tokens and enrollment codes, signed site messages and commands"

[dependencies]
anyhow = "1.0"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
base64 = "0.22"
hex = "0.4"
sha2 = "0.10"
ed25519-dalek = "2.1"
tonic = { version = "0.12", features = ["transport", "tls"] }
prost = "0.13"
itcmdr-keys = { path = "../keys" }
p256 = { version = "0.13", features = ["ecdsa"] }
ciborium = "0.2"
x509-parser = "0.16"

[build-dependencies]
tonic-build = { version = "0.12", features = ["prost"] }
protoc-bin-vendored = "3.0"

[lints]
workspace = true
