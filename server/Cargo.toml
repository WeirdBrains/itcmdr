[package]
name = "itcmdr-server"
version = "0.12.0"
edition = "2021"
description = "itcmdr gRPC server and background ingest"

[[bin]]
name = "itcmdr-server"
path = "src/main.rs"

[[bin]]
name = "itcmdr-cli"
path = "src/bin/itcmdr-cli.rs"

[[bin]]
name = "itcmdr-plugin-ps"
path = "src/bin/itcmdr-plugin-ps.rs"

[[bin]]
name = "itcmdr-restore"
path = "src/bin/itcmdr-restore.rs"

[dependencies]
tokio = { version = "1.40", features = ["rt-multi-thread", "macros", "signal", "time", "process", "io-util"] }
tonic = { version = "0.12", features = ["transport"] }
tonic-web = "0.12"
prost = "0.13"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
thiserror = "1.0"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["fmt", "env-filter", "json"] }
anyhow = "1.0"
parking_lot = "0.12"
chrono = { version = "0.4", features = ["serde"] }
directories = "5"
once_cell = "1.19"
tokio-stream = { version = "0.1", features = ["sync"] }
futures = "0.3"
sqlx = { version = "0.8", default-features = false, features = ["runtime-tokio", "sqlite", "macros"] }
uuid = { version = "1.10", features = ["v4", "serde"] }
zip = { version = "0.6.6", default-features = false, features = ["deflate"] }
walkdir = "2.5.0"
tempfile = "3.10"
sha2 = "0.10"
# SQLCipher, bundled + vendored OpenSSL: no system library needed (build needs perl + a C compiler).
libsqlite3-sys = { version = "0.30", features = ["bundled-sqlcipher-vendored-openssl"] }
rand = "0.8"
ed25519-dalek = { version = "2.1", features = ["rand_core"] }
x25519-dalek = { version = "2.0", features = ["static_secrets"] }
bip39 = { version = "2.1", features = ["rand"] }
hkdf = "0.12"
chacha20poly1305 = "0.10"
zeroize = "1.8"
hex = "0.4"
clap = { version = "4.5", features = ["derive"] }
tar = { version = "0.4", default-features = false }
flate2 = "1"
toml = "0.8"
ureq = "2"
itcmdr-plugin = { path = "../plugin" }
cron = "0.15"
chrono-tz = "0.10"
iana-time-zone = "0.1"


[target.'cfg(windows)'.dependencies]
windows-service = "0.7"
windows-sys = { version = "0.59", features = ["Win32_Foundation", "Win32_Security_Cryptography"] }

[build-dependencies]
tonic-build = { version = "0.12", features = ["prost"] }
prost-build = "0.13"
protoc-bin-vendored = "3.0"

[dev-dependencies]
toml = "0.8"
tar = { version = "0.4", default-features = false }
flate2 = "1"
uuid = { version = "1.10", features = ["v4"] }
sqlx = { version = "0.8", default-features = false, features = ["runtime-tokio", "sqlite"] }
ed25519-dalek = "2.1"
hex = "0.4"
prost = "0.13"
itcmdr-sample-data-gen = { path = "../tools/sample-data-gen" }
tempfile = "3.10"
assert_cmd = "2.0"
predicates = "3.1"
serde_json = "1.0"

