[package]
name = "itcmdr-server"
version = "0.1.0"
edition = "2021"
description = "itcmdr gRPC server and background ingest"

[features]
default = []
windows-service = []

[dependencies]
tokio = { version = "1.40", features = ["rt-multi-thread", "macros", "signal"] }
tonic = { version = "0.12", features = ["transport"] }
tonic-web = "0.12"
prost = "0.13"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
thiserror = "1.0"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["fmt", "env-filter", "json"] }
notify = "6"
anyhow = "1.0"
parking_lot = "0.12"
chrono = { version = "0.4", features = ["serde"] }
directories = "5"
once_cell = "1.19"
tokio-stream = "0.1"
futures = "0.3"
sqlx = { version = "0.8", default-features = false, features = ["runtime-tokio", "sqlite", "macros"] }
uuid = { version = "1.10", features = ["v4", "serde"] }
zip = { version = "0.6.6", default-features = false, features = ["deflate"] }
walkdir = "2.5.0"
tempfile = "3.10"


[build-dependencies]
tonic-build = { version = "0.12", features = ["prost"] }
prost-build = "0.13"
protoc-bin-vendored = "3.0"

[dev-dependencies]
tempfile = "3.10"
assert_cmd = "2.0"
predicates = "3.1"
serde_json = "1.0"

