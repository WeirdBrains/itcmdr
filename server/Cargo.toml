[package]
name = "itcmdr-server"
version = "0.6.2"
edition = "2021"
description = "itcmdr gRPC server and background ingest"

[dependencies]
tokio = { version = "1.40", features = ["rt-multi-thread", "macros", "signal", "time"] }
tonic = { version = "0.12", features = ["transport"] }
tonic-web = "0.12"
prost = "0.13"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
thiserror = "1.0"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["fmt", "env-filter", "json"] }
anyhow = "1.0"
parking_lot = "0.12"
chrono = { version = "0.4", features = ["serde"] }
directories = "5"
once_cell = "1.19"
tokio-stream = { version = "0.1", features = ["sync"] }
futures = "0.3"
sqlx = { version = "0.8", default-features = false, features = ["runtime-tokio", "sqlite", "macros"] }
uuid = { version = "1.10", features = ["v4", "serde"] }
zip = { version = "0.6.6", default-features = false, features = ["deflate"] }
walkdir = "2.5.0"
tempfile = "3.10"
sha2 = "0.10"
# SQLCipher, bundled + vendored OpenSSL: no system library needed (build needs perl + a C compiler).
libsqlite3-sys = { version = "0.30", features = ["bundled-sqlcipher-vendored-openssl"] }
rand = "0.8"
hex = "0.4"


[target.'cfg(windows)'.dependencies]
windows-service = "0.7"
windows-sys = { version = "0.59", features = ["Win32_Foundation", "Win32_Security_Cryptography"] }

[build-dependencies]
tonic-build = { version = "0.12", features = ["prost"] }
prost-build = "0.13"
protoc-bin-vendored = "3.0"

[dev-dependencies]
itcmdr-sample-data-gen = { path = "../tools/sample-data-gen" }
tempfile = "3.10"
assert_cmd = "2.0"
predicates = "3.1"
serde_json = "1.0"

