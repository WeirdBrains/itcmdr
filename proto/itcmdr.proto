syntax = "proto3";

package itcmdr;

// Machine summary for overview lists.
message Machine {
  string name = 1;
  string status = 2;        // "ok", "warning", "error", etc.
  int32 open_incidents = 3; // Count of active incident groups
  int64 last_run_ts = 4;    // Unix millis
}

message ListMachinesRequest {}
message ListMachinesResponse {
  repeated Machine machines = 1;
}

// Request to trigger runs on one or more machines.
message TriggerRunsRequest {
  repeated string machines = 1; // Empty means "all".
  bool report_only = 2;
  bool repair = 3;
  bool force = 4;               // Override clinical guardrails
  repeated string categories = 5;
  repeated string plugins = 6;  // service plugins run on the server (name or name@version)
}
message TriggerRunsResponse {
  string request_id = 1;
}

message GetRequestStatusRequest {
  string request_id = 1;
}
message RequestStatus {
  enum Status {
    UNKNOWN = 0;
    QUEUED = 1;
    RUNNING = 2;
    DONE = 3;
    FAILED = 4;
    TIMED_OUT = 5;  // nobody finished within request_timeout_secs
  }
  Status status = 1;
  string message = 2;
}
message GetRequestStatusResponse {
  RequestStatus.Status status = 1;
  string message = 2;
}

// Metrics and rollups
// Buckets are aligned to ISO weeks: weekly = ISO week (Mon-Sun);
// block4 = 4-ISO-week block N covering weeks 4N-3..4N (13 per ISO year,
// week 53 folds into block 13); yearly = ISO year.
enum Rollup {
  ROLLUP_DAILY = 0;
  ROLLUP_WEEKLY = 1;
  ROLLUP_BLOCK4 = 2;
  reserved 3;      // was ROLLUP_QUARTERLY (dropped)
  ROLLUP_YEARLY = 4;
}

message GetMetricsRequest {
  int32 window_days = 1; // e.g., 7, 30, 90, 365
  Rollup rollup = 2;     // desired aggregation level
}
message MetricPoint {
  string key = 1;      // e.g., machine name or metric id
  int64 ts = 2;        // bucket start (unix millis)
  double value = 3;    // generic numeric value (count, rate)
}
message GetMetricsResponse {
  repeated MetricPoint points = 1;
}

// Exceptions allowlist rules
message ExceptionScope {
  repeated string machines = 1; // machine names or patterns (future)
  string role = 2;              // optional role
}
message ExceptionRule {
  string id = 1;               // server-assigned id
  ExceptionScope scope = 2;
  string check_id = 3;         // exact id
  string check_pattern = 4;    // or regex
  string action = 5;           // "ignore", "downgrade:warn", "downgrade:info"
  string reason = 6;
  string expires = 7;          // ISO date or empty
  bool active = 8;             // computed
}
message ListExceptionsRequest { bool include_inactive = 1; }
message ListExceptionsResponse { repeated ExceptionRule rules = 1; }
message SaveExceptionRequest { ExceptionRule rule = 1; }
message SaveExceptionResponse { ExceptionRule rule = 1; }
message ExpireExceptionRequest { string id = 1; }
message ExpireExceptionResponse {}

// Log browse and search
message SearchLogsRequest {
  string query = 1;        // substring or simple pattern
  string machine = 2;      // optional filter
  int64 start_ts = 3;      // optional unix millis
  int64 end_ts = 4;        // optional unix millis
  int32 limit = 5;         // max lines per page (default 100, max 1000)
  string category = 6;     // optional: network, connectivity, configuration, services
  string status = 7;       // optional: ok, failed, skipped
  int32 offset = 8;        // paging: lines to skip (newest first)
}
message SearchLogsResponse {
  repeated string lines = 1;  // JSON lines, newest first
  int32 total = 2;            // matches before paging
  int32 next_offset = 3;      // 0 when there are no more pages
}

// Audit log of mutating actions (on-demand runs, exception changes)
message AuditEntry {
  int64 ts = 1;        // unix millis
  string actor = 2;
  string action = 3;   // "trigger-runs", "exception-add", "exception-edit", "exception-expire", "backup-create", "backup-verify", "backup-list", "settings-update"
  string detail = 4;   // JSON
}
message ListAuditRequest { int32 limit = 1; }
message ListAuditResponse { repeated AuditEntry entries = 1; }

// Live updates
message WatchUpdatesRequest {}
message Update {
  string kind = 1;    // e.g., "run", "check", "request", "exception"
  string entity = 2;  // e.g., machine or check id
  string id = 3;      // run_id, request_id, etc.
  int64 ts = 4;       // unix millis
}

// Backups (decision 13). Owner/admin only, audit-logged. Restore is CLI-only (server stopped):
// `itcmdr-cli restore --from ARCHIVE [--dry-run]`; app-triggered StageRestore is planned (decision 13).
message BackupInfo {
  string name = 1;
  int64 size = 2;
  int64 created_ts = 3;      // unix millis
  string kind = 4;           // manual, nightly, pre-restore
  string itcmdr_version = 5;
  int64 schema_version = 6;
}
message CreateBackupRequest {}
message CreateBackupResponse { BackupInfo backup = 1; }
message ListBackupsRequest {}
message ListBackupsResponse { repeated BackupInfo backups = 1; }
message VerifyBackupRequest { string name = 1; }
message VerifyBackupResponse { bool ok = 1; string message = 2; }

// Settings (decision 15). Admin/owner only, audit-logged. Stored in the DB, override server.json.
message BackupSettings {
  string dir = 1;          // empty = <data_dir>/backups; must exist and be writable
  bool nightly = 2;
  uint32 hour = 3;         // local hour 0-23
  uint32 keep_daily = 4;
  uint32 keep_weekly = 5;
  uint32 keep_blocks = 6;  // 4-week blocks (ISO weeks 4N-3..4N)
}
message GetSettingsRequest {}
message GetSettingsResponse { BackupSettings backup = 1; }
message UpdateSettingsRequest { BackupSettings backup = 1; }
message UpdateSettingsResponse { BackupSettings backup = 1; }

// Every setting (decision 15, docs/SETTINGS.md). Admin/owner only; updates are validated and audited.
message SettingItem {
  string key = 1;
  string scope = 2;          // "server" or "agent" (agent settings are served to PCs via agent-settings.json)
  string type = 3;           // int, bool, time, path, text
  string value = 4;          // effective value as text ("26", "true", "02:30", "C:\\x")
  string default_value = 5;
  string source = 6;         // default, server.json, db, or db:MACHINE
  string description = 7;
  int64 min = 8;             // int only
  int64 max = 9;             // int only
  bool read_only = 10;       // server.json only
  string applies = 11;       // "next pass", "restart", "agent reinstall", ...
}
message ListSettingsRequest { string machine = 1; }   // optional: resolve that PC's agent overrides
message ListSettingsResponse {
  repeated SettingItem settings = 1;
  repeated string machines_with_overrides = 2;
}
message UpdateSettingRequest {
  string key = 1;
  string value = 2;          // text form, validated server-side
  string machine = 3;        // agent settings only: per-machine override
  bool unset = 4;            // remove the override instead
}
message UpdateSettingResponse { SettingItem setting = 1; }

// ---- v0.10.0: plugin runtime (decisions 6, 11)
message RunPluginRequest {
  string plugin = 1;               // name or name@version (installed + enabled)
  bool report_only = 2;
  map<string, string> args = 3;
  string machine = 4;              // optional, default the server
}
message PluginStage { string stage = 1; bool ok = 2; string message = 3; }
message PluginCheckResult { string check_id = 1; string status = 2; string message = 3; }
message RunPluginResponse {
  string run_id = 1;
  string status = 2;               // ok | verify-failed | failed | error
  string message = 3;
  repeated PluginStage stages = 4;
  repeated PluginCheckResult results = 5;
}
message ListPluginRunsRequest { string plugin = 1; int32 limit = 2; }
message PluginRun {
  string id = 1; string plugin = 2; string version = 3; string machine = 4;
  int64 started = 5; int64 finished = 6; string status = 7; string message = 8; string request_id = 9;
}
message ListPluginRunsResponse { repeated PluginRun runs = 1; }
message GetPluginMetricsRequest {
  string name = 1;                 // empty = all
  map<string, string> labels = 2;  // all must match
  int32 window_days = 3;           // default 7
  bool daily = 4;                  // daily rollup (counters summed, others averaged)
}
message PluginMetricPoint { string name = 1; string labels = 2; int64 ts = 3; double value = 4; }
message LogRejects { string file = 1; int64 count = 2; }
message GetPluginMetricsResponse {
  repeated PluginMetricPoint points = 1;
  repeated LogRejects rejects = 2; // malformed itcmdr.log/v1 lines per file
}

// ---- v0.10.0: schedules (decision 14). Admin manages; user may run now. All audited.
message Schedule {
  string id = 1;
  string name = 2;
  bool enabled = 3;
  bool all_machines = 4;
  repeated string machines = 5;
  repeated string groups = 6;      // agent roles: Server, Workstation, RCU
  repeated string categories = 7;
  repeated string plugins = 8;
  bool repair = 9;                 // false = report-only
  string when = 10;                // hourly | every Nh | daily HH:mm | weekdays HH:mm | weekly <day> HH:mm | cron <5 fields>
  string timezone = 11;            // IANA name or "local"
  string guard = 12;               // report-only-in-hours | skip-in-hours | none
  string missed = 13;              // skip | catch-up
  bool builtin = 14;
  repeated int64 next_runs = 15;   // ms, next 3
  int64 last_fire = 16;
  string builtin_key = 17;         // nightly-agent-run | nightly-backup (built-ins only)
  string action = 18;              // "" = run checks/plugins; "backup" = server nightly backup
}
message SaveScheduleRequest { Schedule schedule = 1; }
message ScheduleResponse { Schedule schedule = 1; }
message ScheduleRef { string id = 1; bool force = 2; string confirm = 3; }   // id or name; deleting a built-in needs force + confirm = its exact name
message ListSchedulesRequest {}
message ListSchedulesResponse { repeated Schedule schedules = 1; }
message RunScheduleNowResponse { string outcome = 1; string request_id = 2; string note = 3; }
message ListScheduleRunsRequest { string id = 1; int32 limit = 2; }
message ScheduleRun {
  string schedule_id = 1; int64 ts = 2; int64 due = 3; string request_id = 4;
  string outcome = 5;              // queued | skipped | missed | failed
  string note = 6;
}
message ListScheduleRunsResponse { repeated ScheduleRun runs = 1; }

// ---- v0.10.0: app-triggered restore (decision 13). Owner only, audited.
message StageRestoreRequest {
  string backup = 1;               // a name from ListBackups
  string words = 2;                // REFUSED since v0.12.0: plaintext words; send sealed_words
  SealedWords sealed_words = 3;    // v0.12.0: the words sealed on the app for a GetRestoreKey key
  bool dry_run = 4;                // check the words and the archive only; nothing changes
  string dry_run_id = 5;           // a real restore needs the id of a passed dry run (same backup, same key, 30 min)
}
// v0.12.0: the 24 words never travel in plaintext. The app seals them for a one-time server key
// (docs/SIGNING.md "Sealed restore words"): X25519 + HKDF (SHA-256) + XChaCha20-Poly1305.
message SealedWords {
  string key_id = 1;               // from GetRestoreKey; single use, 10 minutes
  string eph = 2;                  // hex X25519 public key of the app's one-time key
  string nonce = 3;                // hex, 24 bytes
  string ct = 4;                   // hex ciphertext + tag
}
message GetRestoreKeyRequest {}
message RestoreKey { string key_id = 1; string x25519_pub = 2; int64 expires = 3; }
message RestoreStatus {
  string state = 1;                // staged, stopping, restoring, starting, health-check, rolling-back, done, rolled-back, failed
  string message = 2;
  string backup = 3;
  string actor = 4;
  int64 started = 5;
  int64 updated = 6;
  string safety_copy = 7;
}
message StageRestoreResponse {
  RestoreStatus status = 1;        // unset for a dry run
  string dry_run_id = 2;           // set when a dry run passed
  string message = 3;
}

// ---- v0.12.0: app support
message WhoAmIRequest {}
message WhoAmIResponse { string name = 1; string role = 2; string kind = 3; string fingerprint = 4; string auth_mode = 5; bool signed = 6; }
message KeyInfo { string kind = 1; string name = 2; string role = 3; string fingerprint = 4; string created_at = 5; string revoked_at = 6; }
message ListKeysRequest {}
message ListKeysResponse { repeated KeyInfo keys = 1; }
message RegisterKeyRequest { string bundle_json = 1; string email = 2; string phone = 3; }   // a bundle certified offline with the words (itcmdr-cli keys certify)
message RegisterKeyResponse { KeyInfo key = 1; }
message RevokeKeyRequest { string fingerprint = 1; }
message RevokeKeyResponse { bool revoked = 1; }
message PluginInfo { string name = 1; string version = 2; bool enabled = 3; string installed_at = 4; string signer = 5; string package_sha256 = 6; }
message ListPluginsRequest {}
message ListPluginsResponse { repeated PluginInfo plugins = 1; }
message PreviewScheduleResponse { repeated int64 next_runs = 1; string error = 2; }
message GetRestoreStatusRequest {}
message GetRestoreStatusResponse { RestoreStatus status = 1; }   // unset when no restore ever ran

service Itcmdr {
  rpc ListMachines(ListMachinesRequest) returns (ListMachinesResponse);
  rpc TriggerRuns(TriggerRunsRequest) returns (TriggerRunsResponse);
  rpc GetRequestStatus(GetRequestStatusRequest) returns (GetRequestStatusResponse);
  rpc GetMetrics(GetMetricsRequest) returns (GetMetricsResponse);
  rpc ListExceptions(ListExceptionsRequest) returns (ListExceptionsResponse);
  rpc SaveException(SaveExceptionRequest) returns (SaveExceptionResponse);
  rpc ExpireException(ExpireExceptionRequest) returns (ExpireExceptionResponse);
  rpc SearchLogs(SearchLogsRequest) returns (SearchLogsResponse);
  rpc ListAudit(ListAuditRequest) returns (ListAuditResponse);
  rpc CreateBackup(CreateBackupRequest) returns (CreateBackupResponse);
  rpc ListBackups(ListBackupsRequest) returns (ListBackupsResponse);
  rpc VerifyBackup(VerifyBackupRequest) returns (VerifyBackupResponse);
  rpc GetSettings(GetSettingsRequest) returns (GetSettingsResponse);
  rpc UpdateSettings(UpdateSettingsRequest) returns (UpdateSettingsResponse);
  rpc ListSettings(ListSettingsRequest) returns (ListSettingsResponse);
  rpc UpdateSetting(UpdateSettingRequest) returns (UpdateSettingResponse);
  rpc RunPlugin(RunPluginRequest) returns (RunPluginResponse);
  rpc ListPluginRuns(ListPluginRunsRequest) returns (ListPluginRunsResponse);
  rpc GetPluginMetrics(GetPluginMetricsRequest) returns (GetPluginMetricsResponse);
  rpc CreateSchedule(SaveScheduleRequest) returns (ScheduleResponse);
  rpc UpdateSchedule(SaveScheduleRequest) returns (ScheduleResponse);
  rpc DeleteSchedule(ScheduleRef) returns (ScheduleResponse);
  rpc ListSchedules(ListSchedulesRequest) returns (ListSchedulesResponse);
  rpc PauseSchedule(ScheduleRef) returns (ScheduleResponse);
  rpc ResumeSchedule(ScheduleRef) returns (ScheduleResponse);
  rpc RunScheduleNow(ScheduleRef) returns (RunScheduleNowResponse);
  rpc ListScheduleRuns(ListScheduleRunsRequest) returns (ListScheduleRunsResponse);
  rpc ResetScheduleToDefault(ScheduleRef) returns (ScheduleResponse);   // built-ins: restore defaults (re-creates a deleted one)
  rpc StageRestore(StageRestoreRequest) returns (StageRestoreResponse);
  rpc GetRestoreStatus(GetRestoreStatusRequest) returns (GetRestoreStatusResponse);
  rpc WatchUpdates(WatchUpdatesRequest) returns (stream Update);
  // v0.12.0
  rpc GetRestoreKey(GetRestoreKeyRequest) returns (RestoreKey);            // owner, signed only
  rpc WhoAmI(WhoAmIRequest) returns (WhoAmIResponse);
  rpc ListKeys(ListKeysRequest) returns (ListKeysResponse);                // admin, signed only
  rpc RegisterKey(RegisterKeyRequest) returns (RegisterKeyResponse);       // owner, signed only
  rpc RevokeKey(RevokeKeyRequest) returns (RevokeKeyResponse);             // owner, signed only
  rpc ListPlugins(ListPluginsRequest) returns (ListPluginsResponse);       // admin
  rpc PreviewSchedule(SaveScheduleRequest) returns (PreviewScheduleResponse);
}

