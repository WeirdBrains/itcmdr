// v0.19.0: offsite admin server (adminsvr). Two services:
// - SiteLink: site servers dial adminsvr (pinned TLS + mTLS client certificate issued at site
//   enrollment). Everything the site sends is redacted on the site (ADMINSVR.md decision 19):
//   opaque site-scoped ids, alert codes, severity, plugin names, timestamps, counts and numeric
//   rollups only. No hostnames, IPs, paths, usernames, message text, backup bytes or key material.
// - AdminApi: the admin CLI and app. Every call is signed with the user's device key
//   (x-itcmdr-key/ts/nonce/sig, keys::request_message), like the site server.
// Placeholders only in comments.
syntax = "proto3";
package itcmdr.admin;

service SiteLink {
  // Before Enroll, without using the token: adminsvr's root key, so the site can refuse a server
  // whose root key is not the token's before anything is recorded.
  rpc Prepare(SitePrepareRequest) returns (SitePrepareResponse);
  rpc Enroll(SiteEnrollRequest) returns (SiteEnrollResponse);
  // Long-lived stream: SiteHello first. Every SiteMessage is signed with the site key.
  rpc Link(stream SiteMessage) returns (stream AdminMessage);
  // v0.20.0: a site fetches a catalog package named by a plugin.install command it accepted.
  // Signed by the site key (adminlink::fetch_bytes); only packages of a command for that site.
  rpc FetchPackage(PackageRequest) returns (stream PackageChunk);
}

message PackageRequest { string site_id = 1; string sha256 = 2; int64 ts_ms = 3; string sig = 4; }
message PackageChunk { bytes data = 1; }

message SitePrepareRequest { string token_secret = 1; }
message SitePrepareResponse { string root_public_key = 1; string ca_cert_pem = 2; }

message SiteEnrollRequest {
  string token_secret = 1;
  string site_public_key = 2;  // Ed25519 hex, signs every SiteMessage
  string csr_pem = 3;          // TLS client key CSR (the key stays on the site)
  string version = 4;
}
message SiteEnrollResponse {
  string site_id = 1;
  string client_cert_pem = 2;
  string ca_cert_pem = 3;
  int64 cert_expires_ms = 4;
  string root_public_key = 5;
  int32 heartbeat_secs = 6;
}

message SiteMessage {
  uint64 seq = 1;
  int64 ts_ms = 2;
  // hex Ed25519 by the site key over adminlink::site_bytes(seq, ts_ms, encoded body)
  string sig = 3;
  oneof body {
    SiteHello hello = 4;
    SiteStatus status = 5;
    SiteAlert alert = 6;
    CommandResult result = 7;
    Pong pong = 8;
    SiteConfig config = 9;     // v0.20.0, on link-up and when it changes
    SitePlugins plugins = 10;  // v0.20.0, on link-up and when it changes
  }
}

message SiteHello {
  string site_id = 1;
  string version = 2;
  bool share_display_names = 3;  // the site owner's opt-in (decision 19)
}

// Numbers and enums only.
message SiteStatus {
  string version = 1;
  int64 uptime_secs = 2;
  string auth_mode = 3;          // enum: signed | migrating | token
  int64 backup_age_secs = 4;     // -1 = no backup
  int64 backup_size_bytes = 5;
  string backup_last_result = 6; // enum: ok | failed | none
  int32 agents_online = 7;
  int32 agents_late = 8;
  int32 agents_non_responsive = 9;
  int32 agents_other = 10;
  repeated int64 open_alerts = 11;  // critical, cautious, informational
  repeated SiteMachine machines = 12;
  string cutover_state = 13;     // enum
  // v0.20.0 metrics summaries (numbers only; last 24 h unless named otherwise)
  int64 disk_free_bytes = 14;    // the site server's data volume
  int64 disk_total_bytes = 15;
  int32 runs_24h = 16;           // agent and plugin runs finished
  int32 runs_failed_24h = 17;
  int64 run_secs_avg_24h = 18;
  int64 run_secs_max_24h = 19;
  int32 plugin_errors_24h = 20;
  int32 alerts_opened_24h = 21;
  // v1.0.0: the last `backup drill --deep` (date and result only; never backup contents)
  int64 deep_check_ms = 22;      // 0 = never run
  string deep_check_result = 23; // enum: ok | failed | none
}

// v0.20.0: the site's configuration as adminsvr may see it. Values are sent only for numbers,
// switches and times; text and path values stay on the site (hidden = true).
message SiteConfig {
  string version = 1;            // sha256 of the document (without this field)
  repeated SettingItem settings = 2;
  repeated ScheduleItem schedules = 3;
  bool require_two_person = 4;   // the site's adminsvr.requireTwoPerson
  repeated string allowed = 5;   // the site's local command allowlist
}
message SettingItem {
  string key = 1;
  string kind = 2;     // int | bool | time | path | text
  string value = 3;    // JSON; empty when hidden
  bool hidden = 4;
  bool remote = 5;     // may be set from adminsvr (setting.set)
  string source = 6;   // default | server.json | db
  string scope = 7;    // server | agent
  int64 min = 8;
  int64 max = 9;
}
message ScheduleItem {
  string id = 1;       // opaque
  string name = 2;     // only with the site's display-name opt-in
  bool enabled = 3;
  string when = 4;     // cron
  string timezone = 5;
  string action = 6;   // run | backup
  string guard = 7;
  string missed = 8;
  bool repair = 9;
  string builtin = 10; // nightly-agent-run | nightly-backup | ""
  bool all_machines = 11;
  int32 machines = 12; // count
  repeated string groups = 13;
  repeated string categories = 14;
  repeated string plugins = 15;
  int64 last_fire_ms = 16;
}
message SitePlugins {
  string version = 1;
  repeated PluginItem installed = 2;
  repeated QuarantineItem quarantine = 3;
}
message PluginItem { string name = 1; string version = 2; bool enabled = 3; string sha256 = 4; }
message QuarantineItem { string sha256 = 1; string reason = 2; int64 ts_ms = 3; } // reason: a code

message SiteMachine {
  string id = 1;            // opaque, site-scoped (HMAC with a site-local secret)
  string state = 2;         // enum
  int64 last_seen_ms = 3;
  string version = 4;
  string display_name = 5;  // only with the site's opt-in
}

message SiteAlert {
  string id = 1;            // opaque
  string code = 2;          // the alert key with names replaced by opaque ids
  string severity = 3;      // critical | cautious | informational
  string state = 4;         // open | acked | silenced | resolved
  string source = 5;        // enum
  string plugin = 6;        // plugin package name, if any
  string machine = 7;       // opaque machine id, if any
  int64 first_seen_ms = 8;
  int64 last_seen_ms = 9;
  int64 count = 10;
  string machine_display_name = 11;  // only with the site's opt-in
}

message CommandResult {
  string command_id = 1;
  bool ok = 2;
  string code = 3;  // result code only (no output text): ok | refused | not-allowed | bad-signature | failed | expired
                    // | needs-approval | quarantined | invalid
  repeated ConfigChange preview = 4;  // v0.20.0 dry runs (and what an applied command changed)
}
message ConfigChange {
  string target = 1;   // setting key, schedule:<id>, plugin:<name>
  string before = 2;   // values only for numbers, switches, times, versions and states
  string after = 3;
}

message Ping { int64 ts_ms = 1; }
message Pong { int64 ts_ms = 1; }

message AdminMessage {
  uint64 ack_seq = 1;
  oneof body {
    Ping ping = 2;
    Command command = 3;
  }
}

// A command from adminsvr, signed by the acting user's device key and the adminsvr root key.
// The site checks both, its own allowlist and the never-remote list, and audits it locally.
message Command {
  string id = 1;
  string kind = 2;                 // backup.start | alert.ack | alert.resolve
  map<string, string> args = 3;
  string user_id = 4;
  string user_role = 5;
  string user_key = 6;             // device public key (hex)
  string user_endorsement = 7;     // root sig over adminlink::endorse_bytes(user_id, role, user_key)
  int64 issued_ms = 8;
  int64 expires_ms = 9;
  string user_sig = 10;            // over adminlink::command_bytes(...)
  string root_sig = 11;            // over the same bytes
  string site_id = 12;             // the site it is for (checked by the site)
  // v0.20.0. dry_run: the site checks and previews, changes nothing (signed with the command).
  bool dry_run = 13;
  // Second person (two-person kinds): an owner or admin other than the requester, endorsed by
  // the root like the user; approver_sig over adminlink::approve_bytes(command).
  string approver_id = 14;
  string approver_role = 15;
  string approver_key = 16;
  string approver_endorsement = 17;
  string approver_sig = 18;
  // v0.21.0: the organization's "require a second approver" setting when the command was made
  // (signed with the command). A site requires the approver (or two release approvals) when this
  // is set or its own adminsvr.requireTwoPerson is on.
  bool two_person = 19;
  // v0.21.0 release.rollout: the one-time approvals of that release (name, version, sha256).
  repeated ReleaseApproval release_approvals = 20;
}

// v0.21.0: an owner or admin approves one release once; adminsvr may then roll it out to sites
// and push it. sig over adminlink::release_bytes(name, version, sha256); the key endorsed by the
// root like a command's user.
message OrgPolicy {
  bool require_second_approver = 1;   // default false
  string updated_by = 2;
  int64 updated_ms = 3;
  // v1.0.0: warn when a site's last deep backup check is older than this (default 90).
  // SetOrgPolicy: 0 keeps the current value.
  int32 deep_check_max_days = 4;
}
message ReleaseState {
  string sha256 = 1;
  string name = 2;
  string version = 3;
  repeated string approved_by = 4;   // user ids
  int32 needed = 5;                  // 1, or 2 with require_second_approver
  bool approved = 6;
}
message ReleaseList { repeated ReleaseState releases = 1; }
message ApproveReleaseRequest {
  string sha256 = 1;
  string sig = 2;   // the caller's device key over adminlink::release_bytes(name, version, sha256)
}

message ReleaseApproval {
  string user_id = 1;
  string role = 2;
  string key = 3;
  string endorsement = 4;
  string sig = 5;
  int64 ts_ms = 6;
}

// ---- Admin API (CLI and app) ----

service AdminApi {
  // Unsigned: anyone may ask; returns versions and whether this server is initialized.
  rpc Info(Empty) returns (InfoResponse);
  // Signed by the new device key; authorized by the one-time code.
  rpc EnrollDevice(EnrollDeviceRequest) returns (UserInfo);
  rpc WhoAmI(Empty) returns (UserInfo);

  rpc ListUsers(Empty) returns (UserList);
  rpc CreateUser(CreateUserRequest) returns (CreateUserResponse);
  rpc SetRole(SetRoleRequest) returns (UserInfo);
  rpc SetUserStatus(SetUserStatusRequest) returns (UserInfo);
  rpc SetScopes(SetScopesRequest) returns (UserInfo);
  rpc ApproveDevice(ApproveDeviceRequest) returns (UserInfo);
  rpc NewEnrollCode(UserRef) returns (CreateUserResponse);
  rpc ListDevices(UserRef) returns (DeviceList);
  rpc RevokeDevice(RevokeDeviceRequest) returns (DeviceList);

  // Client-side encrypted device key backup (adminsvr only holds ciphertext).
  rpc PutKeyBackup(KeyBackup) returns (Empty);
  // Signed with the user's master key (re-derived from the 24 words) or a device key.
  rpc GetKeyBackup(UserRef) returns (KeyBackup);
  rpc SetKeyBackupOptOut(KeyBackupOptOut) returns (UserInfo);
  // Signed with the master key: certify a new device key for this user (no code needed).
  rpc AddDevice(AddDeviceRequest) returns (UserInfo);

  rpc CreateSite(CreateSiteRequest) returns (CreateSiteResponse);
  rpc ListSites(Empty) returns (SiteList);
  rpc RevokeSite(SiteRef) returns (SiteInfo);

  rpc ListAlerts(AlertFilter) returns (AlertList);
  // The client builds the Command (kind, args, its user id/role, times) and signs it with its
  // device key; adminsvr checks it, adds the root endorsement and signature and queues it.
  rpc AckAlert(CommandRequest) returns (CommandInfo);
  rpc ResolveAlert(CommandRequest) returns (CommandInfo);
  rpc StartBackup(CommandRequest) returns (CommandInfo);
  rpc ListCommands(SiteRef) returns (CommandList);
  // v0.20.0: setting.set, schedule.run|pause|resume, plugin.enable|disable|install, and dry runs.
  // Two-person kinds wait for ApproveCommand by a different owner or admin.
  rpc SendCommand(CommandRequest) returns (CommandInfo);
  rpc GetCommand(CommandRef) returns (CommandDetail);
  // The approver signs adminlink::approve_bytes(command) with their device key.
  rpc ApproveCommand(ApproveRequest) returns (CommandInfo);
  // v0.21.0. The organization's two-person setting (read: anyone signed; set: owners, audited).
  rpc GetOrgPolicy(Empty) returns (OrgPolicy);
  rpc SetOrgPolicy(OrgPolicy) returns (OrgPolicy);
  // v0.21.0 releases: catalog packages named itcmdr-agent-release / itcmdr-server-release, their
  // approvals, approve once (owners/admins). Then SendCommand release.rollout per site
  // (args name, version, sha256, push) rolls it out; push = now, ignoring the site's window.
  rpc ListReleases(Empty) returns (ReleaseList);
  rpc ApproveRelease(ApproveReleaseRequest) returns (ReleaseState);
  rpc RejectCommand(CommandRef) returns (CommandInfo);
  rpc GetSiteConfig(SiteRef) returns (SiteConfigInfo);
  rpc GetSitePlugins(SiteRef) returns (SitePluginsInfo);
  // Plugin catalog: adminsvr stores packages (signed by a site-trusted key; adminsvr can't sign).
  rpc UploadPlugin(PluginUpload) returns (CatalogEntry);
  rpc ListCatalog(Empty) returns (Catalog);
  // Global freeze (owners): every command is refused and nothing queued is sent.
  rpc GetFreeze(Empty) returns (FreezeState);
  rpc SetFreeze(FreezeState) returns (FreezeState);

  rpc ListAudit(AuditFilter) returns (AuditList);
  rpc VerifyAudit(Empty) returns (AuditVerify);

  // v0.19.1 passkeys / security keys (WebAuthn) as a second factor. Step-up: for a method in the
  // policy, a user with a passkey adds header x-itcmdr-stepup (base64 StepUpAssertion) whose
  // challenge is sha256("itcmdr-stepup/v1" || sha256(method "\n" body) || nonce from BeginStepUp).
  rpc BeginPasskeyRegistration(Empty) returns (PasskeyChallenge);
  rpc FinishPasskeyRegistration(PasskeyRegistration) returns (PasskeyList);
  rpc ListPasskeys(UserRef) returns (PasskeyList);
  // Your own, or (owner/admin, with their own step-up) another user's lost passkey.
  rpc RemovePasskey(PasskeyRef) returns (PasskeyList);
  // Signed by a device key or the master key; the nonce is single use and lives 5 minutes.
  rpc BeginStepUp(Empty) returns (PasskeyChallenge);
  rpc GetAuthPolicy(Empty) returns (AuthPolicy);
  // Owners only.
  rpc SetAuthPolicy(AuthPolicy) returns (AuthPolicy);

  // v0.19.2: the status history a site sent (numbers and enums only; kept 30 days).
  rpc ListSiteMetrics(MetricsFilter) returns (MetricsSeries);
  // v0.19.2 push notifications for alerts (FCM / APNs). The token belongs to the calling device:
  // revoking the device stops its pushes. Payloads carry opaque ids and the severity only.
  rpc RegisterPush(PushRegistration) returns (Empty);
  rpc UnregisterPush(PushRegistration) returns (Empty);
  rpc TestPush(Empty) returns (PushResult);
}

message MetricsFilter { string site = 1; int64 since_ms = 2; int32 limit = 3; }
message MetricsSample { int64 ts_ms = 1; SiteStatus status = 2; }
message MetricsSeries { string site = 1; repeated MetricsSample samples = 2; }
message PushRegistration {
  string provider = 1;  // fcm | apns
  string token = 2;
  string platform = 3;  // android | ios | macos
}
message PushResult { int32 sent = 1; int32 failed = 2; int32 devices = 3; repeated string providers = 4; }

message PasskeyChallenge {
  string nonce = 1;
  bytes challenge = 2;              // registration: the WebAuthn challenge
  string rp_id = 3;
  bytes user_handle = 4;
  string user_name = 5;
  repeated bytes credential_ids = 6; // your registered credentials
  int64 expires_ms = 7;
  bool require_user_verification = 8;
}
message PasskeyRegistration {
  string nonce = 1;
  string label = 2;
  bytes client_data_json = 3;
  bytes attestation_object = 4;     // browsers; or the parts below (CTAP tools)
  string fmt = 5;
  bytes auth_data = 6;
  bytes att_sig = 7;
  repeated bytes x5c = 8;
  bool hmac_secret = 9;             // created with hmac-secret (used to unlock the local key)
}
message PasskeyInfo {
  string credential_id = 1;         // base64url
  string label = 2;
  int64 alg = 3;
  string aaguid = 4;
  string attestation = 5;
  int64 sign_count = 6;
  bool hmac_secret = 7;
  int64 created_ms = 8;
  int64 last_used_ms = 9;
}
message PasskeyList { repeated PasskeyInfo passkeys = 1; }
message PasskeyRef { string user = 1; string credential_id = 2; }
message StepUpAssertion {
  string nonce = 1;
  bytes credential_id = 2;
  bytes client_data_json = 3;
  bytes auth_data = 4;
  bytes signature = 5;
}
message AuthPolicy {
  repeated string stepup_actions = 1;          // AdminApi method names, e.g. SetRole
  repeated string passkey_required_roles = 2;  // e.g. owner
  bool require_user_verification = 3;
}

message Empty {}
message InfoResponse { string version = 1; bool initialized = 2; string root_public_key = 3; }

message UserInfo {
  string id = 1;
  string email = 2;
  string name = 3;
  string role = 4;
  string status = 5;            // active | disabled
  repeated string sites = 6;    // scoped site ids (sre)
  bool key_backup = 7;          // a backup blob is stored
  bool key_backup_opt_out = 8;
  int64 created_ms = 9;
  repeated DeviceInfo devices = 10;
  string master_fingerprint = 11;
  int32 passkeys = 12;          // v0.19.1
}
message UserList { repeated UserInfo users = 1; }
message UserRef { string user = 1; }  // id or email ("" = me)

message CreateUserRequest { string email = 1; string name = 2; string role = 3; }
message CreateUserResponse { UserInfo user = 1; string enroll_code = 2; int64 expires_ms = 3; }
message SetRoleRequest { string user = 1; string role = 2; }
message SetUserStatusRequest { string user = 1; bool disabled = 2; }
message SetScopesRequest { string user = 1; repeated string sites = 2; }
message ApproveDeviceRequest { string user = 1; string device_fingerprint = 2; }

message EnrollDeviceRequest {
  string code = 1;                // the one-time code's secret
  string master_public_key = 2;   // hex
  string device_public_key = 3;   // hex
  string certificate_json = 4;    // keys::Certificate by the master over the device key
  string platform = 5;
  KeyBackup key_backup = 6;       // on by default; empty = opted out
}

message DeviceInfo {
  string fingerprint = 1;
  string platform = 2;
  string status = 3;   // pending | active | revoked
  int64 created_ms = 4;
  int64 last_used_ms = 5;
}
message DeviceList { repeated DeviceInfo devices = 1; }
message RevokeDeviceRequest { string user = 1; string device_fingerprint = 2; }

message KeyBackup { string user = 1; string blob_json = 2; }
message KeyBackupOptOut { bool opt_out = 1; }
message AddDeviceRequest {
  string device_public_key = 1;
  string certificate_json = 2;
  string platform = 3;
}

message CreateSiteRequest { string name = 1; }
message CreateSiteResponse { SiteInfo site = 1; string token = 2; int64 expires_ms = 3; }
message SiteRef { string site = 1; }
message SiteInfo {
  string id = 1;
  string name = 2;
  string status = 3;       // pending | online | late | unreachable | revoked
  string version = 4;
  int64 last_seen_ms = 5;
  bool share_display_names = 6;
  SiteStatus last_status = 7;
}
message SiteList { repeated SiteInfo sites = 1; }

message AlertFilter { string site = 1; string state = 2; int32 limit = 3; }
message AlertInfo {
  string site = 1;
  SiteAlert alert = 2;
  string origin = 3;   // site | adminsvr (e.g. site unreachable)
}
message AlertList { repeated AlertInfo alerts = 1; }
message CommandRequest { Command command = 1; }

message CommandInfo {
  string id = 1;
  string site = 2;
  string kind = 3;
  string state = 4;   // awaiting-approval | pending | sent | applied | previewed | failed | expired | rejected
  string result_code = 5;
  string requested_by = 6;
  int64 created_ms = 7;
  // v0.20.0
  bool dry_run = 8;
  repeated ConfigChange preview = 9;
  string approved_by = 10;
  map<string, string> args = 11;
}
message CommandList { repeated CommandInfo commands = 1; }
message CommandRef { string id = 1; }
message CommandDetail { CommandInfo info = 1; Command command = 2; }
message ApproveRequest { string id = 1; string approver_key = 2; string approver_sig = 3; }
message SiteConfigInfo { string site = 1; SiteConfig config = 2; int64 received_ms = 3; }
message SitePluginsInfo { string site = 1; SitePlugins plugins = 2; int64 received_ms = 3; }
message PluginUpload { bytes package = 1; }
message CatalogEntry {
  string sha256 = 1; string name = 2; string version = 3; int64 size = 4;
  string uploaded_by = 5; int64 uploaded_ms = 6; string description = 7;
}
message Catalog { repeated CatalogEntry packages = 1; }
message FreezeState { bool frozen = 1; string by = 2; int64 since_ms = 3; }

message AuditFilter { int32 limit = 1; string user = 2; }
message AuditEntry {
  int64 seq = 1;
  int64 ts_ms = 2;
  string actor = 3;
  string actor_key = 4;
  string action = 5;
  string target = 6;
  string payload_sha256 = 7;
  string request_sig = 8;
  string prev_hash = 9;
  string hash = 10;
}
message AuditList { repeated AuditEntry entries = 1; }
message AuditVerify { bool ok = 1; int64 entries = 2; int64 first_bad_seq = 3; string problem = 4; }
