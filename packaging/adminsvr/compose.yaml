# itcmdr-adminsvr (v0.19.2; tested with rootless Podman). SQLite in the data volume by default:
#   podman compose up -d
#   podman compose exec adminsvr itcmdr-adminsvr init --email you@example.com --name "Your Name"
# With Postgres instead: set ADMINSVR_DB_PASSWORD and
#   ADMINSVR_DB_URL=postgres://itcmdr_adminsvr:<password>@db:5432/itcmdr_adminsvr
# then: podman compose --profile postgres up -d
services:
  adminsvr:
    build: { context: ../.., dockerfile: packaging/adminsvr/Containerfile }
    image: itcmdr-adminsvr
    environment:
      ITCMDR_ADMINSVR_DB_URL: ${ADMINSVR_DB_URL:-}
      ITCMDR_ADMINSVR_PUBLIC_API: ${ADMINSVR_PUBLIC_API:-}
      ITCMDR_ADMINSVR_PUBLIC_SITE: ${ADMINSVR_PUBLIC_SITE:-}
      ITCMDR_ADMINSVR_TLS_NAMES: ${ADMINSVR_TLS_NAMES:-}
    ports: ["8443:8443", "8444:8444"]
    volumes: [data:/var/lib/itcmdr-adminsvr]
    restart: unless-stopped
  db:
    profiles: [postgres]
    image: docker.io/library/postgres:16
    environment:
      POSTGRES_USER: itcmdr_adminsvr
      POSTGRES_PASSWORD: ${ADMINSVR_DB_PASSWORD:-}
      POSTGRES_DB: itcmdr_adminsvr
    volumes: [db:/var/lib/postgresql/data]
    restart: unless-stopped
volumes: { db: {}, data: {} }
