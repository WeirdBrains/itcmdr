[package]
name = "itcmdr-agentlink"
version = "1.3.4"
edition.workspace = true
license.workspace = true
description = "itcmdr agent link: agent.proto, enrollment tokens, pinned TLS, the site CA and the signed Hello"

[dependencies]
anyhow = "1.0"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
base64 = "0.22"
hex = "0.4"
sha2 = "0.10"
ed25519-dalek = "2.1"
tonic = { version = "0.12", features = ["transport", "tls"] }
prost = "0.13"
tokio = { version = "1.40", features = ["net", "rt", "sync", "time"] }
tokio-stream = "0.1"
tokio-rustls = { version = "0.26", default-features = false, features = ["ring", "tls12", "logging"] }
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12", "logging"] }
rcgen = { version = "0.13", default-features = false, features = ["ring", "pem", "x509-parser"] }
x509-parser = "0.16"
hyper-util = { version = "0.1", features = ["tokio"] }
tower = { version = "0.4", features = ["util"] }
time = "0.3"
rustls-native-certs = "0.8"

[build-dependencies]
tonic-build = { version = "0.12", features = ["prost"] }
protoc-bin-vendored = "3.0"

[lints]
workspace = true

[dev-dependencies]
tokio = { version = "1.40", features = ["macros", "rt-multi-thread", "net"] }
