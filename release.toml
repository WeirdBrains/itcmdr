# itcmdr release config for weirdnet-project-helpers (scripts/weirdnet_release.py).
# Usage: python3 scripts/weirdnet_release.py [--patch|--major] "title of the release"
helpers = "0.1.1"
project = "itcmdr"
require_message = true
tag_message = "itcmdr {version}: {title}"
next = [
  "build every asset from {tag}: docs/RELEASE-LOCAL.md (scripts/release-local.sh build/check/publish)",
  "python3 scripts/weirdnet_release.py assets {version}   # every platform file is on the release",
  "python3 scripts/weirdnet_release.py taur {version} --dry-run, then without --dry-run (scripts/publish_taur.py)",
]

[env]
CARGO_TARGET_DIR = "/mnt/ext1/cargo-target"

[[files]]                       # the product crates (not itcmdr-common, common/derive, itcmdr-plugin, sample-data-gen)
kind = "cargo-package"
primary = true
paths = ["server/Cargo.toml", "watchdog/Cargo.toml", "agent-rs/Cargo.toml", "keys/Cargo.toml",
         "agentlink/Cargo.toml", "adminsvr/Cargo.toml", "admin-cli/Cargo.toml", "help/Cargo.toml",
         "adminlink/Cargo.toml", "admin-app/rust/Cargo.toml", "app/rust/Cargo.toml"]

[[files]]
kind = "cargo-lock"
paths = ["Cargo.lock", "app/rust/Cargo.lock", "admin-app/rust/Cargo.lock"]

[[files]]                       # X.Y.Z+N, both apps share the build number and get N+1
kind = "pubspec"
paths = ["app/pubspec.yaml", "admin-app/pubspec.yaml"]
build = "increment"

[[files]]
kind = "pubspec"
path = "site_jaspr/pubspec.yaml"
build = "none"

[[files]]
kind = "regex"
path = "agent/Invoke-ItcmdrAgent.ps1"
pattern = "^\\$script:AgentVersion = '{old}'"
replace = "$script:AgentVersion = '{version}'"

[[files]]
kind = "regex"
path = "installer/common.iss"
pattern = '#define MyAppVersion "{old}"'
replace = '#define MyAppVersion "{version}"'

[[files]]
kind = "regex"
path = "docs/HANDOVER.md"
pattern = 'Latest tag: \*\*v{old}\*\*'
replace = 'Latest tag: **v{version}** ({title}). Previous: **v{old}**'

[[files]]                       # the release table row
kind = "insert-after"
path = "PLAN.md"
pattern = '^\| v{old} \|'
exists = '^\| v{version} \|'
line = "| v{version} | {title_cell} | ✅ Released {date} |"

[changelog]
path = "CHANGELOG.md"
style = "raw"                   # "## Unreleased" notes move verbatim under the new heading
unreleased = "## Unreleased"
heading = "## v{version} ({date})"
intro = ["itcmdr {version}: {title}.", "- Versions {version} (app and admin app {version}+{build})."]

[hooks]
# Packages already in dist/X.Y.Z must carry their pacman .sig (Michael signs).
pre = ["test ! -d dist/{version} || python3 scripts/check_pkg_sigs.py dist/{version}"]
# The embedded help must match the tag.
post_bump = ["python3 scripts/gen-help.py", "python3 scripts/gen-help.py --check"]
stage = ["app/lib/help_topics.g.dart", "admin-app/lib/help_topics.g.dart"]

[checks]
commands = ["cargo fmt --all -- --check", "cargo clippy --workspace --all-targets -- -D warnings"]

[taur]
org = "WeirdBrains"

[[taur.packages]]               # project publisher: renders the recipe from SHA256SUMS, checks build stamps,
name = "itcmdr-bin"             # .sig pairs, privacy scan and public visibility twice
command = "python3 scripts/publish_taur.py {version}"

[[platforms]]
os = "linux"
arch = ["x86_64"]
arch_note = "no aarch64 Linux builds yet"
formats = ["tar.gz"]
channels = ["github", "taur"]
assets = ["itcmdr-cli-{version}-linux-x86_64.tar.gz", "itcmdr-admin-{version}-linux-x86_64.tar.gz",
          "itcmdr-adminsvr-{version}-linux-x86_64.tar.gz", "itcmdr-app-{version}-linux-x86_64.tar.gz",
          "itcmdr-admin-app-{version}-linux-x86_64.tar.gz"]

[[platforms]]
os = "macos"
arch = ["aarch64"]
arch_note = "no x86_64 macOS builds"
formats = ["tar.gz", "zip"]
channels = ["github"]
assets = ["itcmdr-cli-{version}-macos-aarch64.tar.gz", "itcmdr-app-{version}-macos-aarch64.zip", "itcmdr-admin-app-{version}-macos-aarch64.zip"]

[[platforms]]
os = "windows"
arch = ["x86_64"]
arch_note = "no ARM64 Windows builds yet"
formats = ["exe"]
channels = ["github"]
assets = ["itcmdr-server-Setup-{version}.exe", "itcmdr-agent-Setup-{version}.exe", "itcmdr-cli-Setup-{version}.exe",
          "itcmdr-app-Setup-{version}.exe", "itcmdr-admin-Setup-{version}.exe", "itcmdr-admin-app-Setup-{version}.exe",
          "itcmdr-adminsvr-Setup-{version}.exe"]

[[platforms]]                   # the admin app ships an Android apk; no aab, F-Droid or Play yet
os = "android"
arch = ["aarch64"]
formats = ["apk"]
channels = ["github", "apk-sideload"]
assets = ["itcmdr-admin-app-{version}-android.apk"]

[[platforms]]                   # admin-app/ios exists; no ipa is built yet
os = "ios"
arch = ["aarch64"]
formats = ["ipa"]
channels = []
assets = []
